global
    log stdout format raw local0 notice
    maxconn 100000
    nbthread 8

defaults
    mode http
    log global
    option httplog
    option http-keep-alive
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    retries 2

# ==============================
# MASTER ENTRYPOINT
# ==============================
frontend gptoss_master
    bind *:6767
    default_backend gptoss_backends

    stats enable
    stats uri /stats
    stats refresh 2s

# ==============================
# BACKEND (2 VLLM INSTANCES)
# ==============================
backend gptoss_backends
    balance leastconn

    option httpchk GET /health
    http-check expect status 200

    default-server inter 5s fall 3 rise 2 maxconn 512

    # Two vLLM servers
    server vllm_8000 10.0.173.237:8000 check
    server vllm_8001 10.0.173.237:8001 check
